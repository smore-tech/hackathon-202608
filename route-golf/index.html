<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROUTE GOLF</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .board{
    position:relative; display:grid; gap:3px; padding:8px; background:#0f131c;
    border:1px solid var(--border); border-radius:10px; width:max-content; margin:0 auto;
    --cell:min(13.5vw, 54px);
  }
  .cell{
    position:relative; width:var(--cell); height:var(--cell); border-radius:6px; background:#1c2333;
    display:flex; align-items:center; justify-content:center; font-size:calc(var(--cell)*.5);
    cursor:default; transition:background .15s;
  }
  .board.editing .cell{cursor:pointer}
  .board.editing .cell:hover{outline:2px solid rgba(110,231,183,.5); outline-offset:-2px}
  .cell.wall{background:#39425c; box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
  .cell.goal{background:rgba(251,191,36,.15); outline:2px dashed rgba(251,191,36,.55); outline-offset:-3px}
  .cell.startmark{outline:2px dotted rgba(125,211,252,.5); outline-offset:-3px}
  .cell.star{color:var(--amber); text-shadow:0 0 10px rgba(251,191,36,.6)}
  .cell.taken{opacity:.2; filter:grayscale(1)}
  .cell.trail::after{content:""; position:absolute; width:8px; height:8px; border-radius:50%; background:rgba(125,211,252,.35)}

  #robot{
    position:absolute; left:0; top:0; width:var(--cell); height:var(--cell);
    display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:3;
    transition:transform .16s ease-out;
  }
  #robot .body{
    width:74%; height:74%; border-radius:9px; background:linear-gradient(180deg,#7dd3fc,#38bdf8);
    display:flex; align-items:flex-start; justify-content:center;
    box-shadow:0 0 14px rgba(125,211,252,.55); color:#062a3a; font-size:calc(var(--cell)*.42);
    font-weight:900; line-height:1;
  }
  #robot.crash .body{background:linear-gradient(180deg,#fca5a5,#f87171); animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .prog{
    display:flex; flex-wrap:wrap; gap:5px; min-height:46px; padding:9px; background:#0f131c;
    border:1px solid var(--border); border-radius:9px; font-family:var(--mono);
  }
  .prog .tok{
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    border-radius:6px; background:#242c3d; font-size:13px; font-weight:800; color:var(--dim);
  }
  .prog .tok.done{color:var(--text); background:#2f3a52}
  .prog .tok.now{background:var(--accent); color:var(--ink); transform:scale(1.15)}
  .prog .empty{color:#4b5468; font-size:12px; align-self:center}
  .cmdbtn{width:56px; font-size:18px; font-weight:800; padding:12px 0}
  .cmdbtn.f{color:var(--accent)} .cmdbtn.l,.cmdbtn.r{color:var(--blue)}
  .palette button.on, .dirsel button.on{background:var(--accent); color:var(--ink); border-color:transparent; font-weight:800}
  .levelhead{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--dim); margin:14px 0 8px}
  .levelhead:first-child{margin-top:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>ROUTE <span class="g">GOLF</span></h1>
    <a class="home" href="../index.html">← ゲーム一覧</a>
    <div class="tabs">
      <button id="tabStages">STAGES</button>
      <button id="tabPlay" class="on">PLAY</button>
      <button id="tabCreate">CREATE</button>
    </div>
  </div>
  <p class="tagline">// できるだけ短い命令列でロボットをゴールへ運べ</p>

  <div id="notice" hidden></div>

  <!-- ============ STAGES ============ -->
  <div id="stagesView" hidden>
    <div class="panel">
      <div class="row spread" style="margin-bottom:12px">
        <div class="hud">
          <span>CLEAR <b id="hudCleared">0</b> / <span id="hudTotal">0</span></span><span class="sep"></span>
          <span>★ <b id="hudStars">0</b> / <span id="hudStarMax">0</span></span>
        </div>
        <button id="resetProgress" class="ghost danger">記録をリセット</button>
      </div>
      <div id="stageList"></div>
    </div>
  </div>

  <!-- ============ PLAY ============ -->
  <div id="playView">
    <div class="panel">
      <div class="row spread">
        <div class="row">
          <span class="badge violet" id="chNo">STAGE 1</span>
          <b id="chName" style="font-size:14px">—</b>
          <span class="badge" id="chSize">5×5</span>
          <span class="badge medium" id="chPar">PAR 10</span>
          <span class="badge" id="chStarCount" hidden>★0</span>
          <span class="badge url" id="chSource">STAGE</span>
        </div>
        <div class="row">
          <span class="hint" id="chBest">BEST —</span>
          <button id="prevStage" class="ghost">◀</button>
          <button id="nextStage" class="ghost">▶</button>
        </div>
      </div>
    </div>

    <div class="cols side" style="margin-top:14px">
      <div class="panel">
        <h2>Board</h2>
        <div class="board" id="board"><div id="robot"><div class="body">▲</div></div></div>
        <div class="row" style="margin-top:12px; justify-content:center">
          <button class="cmdbtn f" data-cmd="F">F</button>
          <button class="cmdbtn l" data-cmd="L">L</button>
          <button class="cmdbtn r" data-cmd="R">R</button>
        </div>
        <p class="hint" style="text-align:center; margin:8px 0 0">
          F=前進 / L=左回転 / R=右回転（キーボード F L R・Enter=RUN・Backspace=UNDO）
        </p>
      </div>

      <div class="panel">
        <h2>Program <span id="progLen" style="color:var(--text)">0</span></h2>
        <div class="prog" id="prog"><span class="empty">// F / L / R を押して命令を並べる</span></div>
        <div class="row" style="margin-top:10px">
          <button id="run" class="primary">▶ RUN</button>
          <button id="step">STEP</button>
          <button id="reset">RESET</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="undo" class="ghost">UNDO</button>
          <button id="clearProg" class="ghost danger">CLEAR</button>
        </div>
        <div class="result idle" id="result" style="margin-top:12px">READY — RUN で実行</div>
        <div class="row" style="margin-top:10px">
          <button id="share">🔗 SHARE</button>
          <button id="remix">🎛 REMIX</button>
          <button id="copyResult" disabled>📋 COPY RESULT</button>
        </div>
        <div class="share-box" style="margin-top:8px">
          <div class="copy-status" id="copyStatus"></div>
          <textarea id="shareOut" rows="3" readonly hidden></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ CREATE ============ -->
  <div id="createView" hidden>
    <div class="cols side">
      <div class="panel">
        <h2>Edit Board</h2>
        <div class="board editing" id="edBoard"></div>
        <p class="hint" style="text-align:center; margin-top:10px" id="edHint"></p>
      </div>

      <div class="panel">
        <h2>Settings</h2>
        <label class="field">Grid size</label>
        <div class="row dirsel" id="sizeSel" style="margin-bottom:12px"></div>

        <label class="field">Tool</label>
        <div class="row palette" id="palette" style="margin-bottom:12px"></div>

        <label class="field">Start direction</label>
        <div class="row dirsel" id="dirSel" style="margin-bottom:12px"></div>

        <label class="field" for="parInput">PAR</label>
        <div class="row" style="margin-bottom:12px">
          <input type="number" id="parInput" min="1" max="99" value="10" style="width:90px">
          <button id="autoPar">AUTO</button>
        </div>

        <div class="result idle" id="edStatus">—</div>

        <div class="row" style="margin-top:12px">
          <button id="edShare" class="primary">🔗 SHARE</button>
          <button id="edTest">▶ TEST PLAY</button>
        </div>
        <div class="share-box" style="margin-top:8px">
          <div class="copy-status" id="edCopyStatus"></div>
          <textarea id="edShareOut" rows="3" readonly hidden></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
