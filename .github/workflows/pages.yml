name: Deploy to GitHub Pages

# このリポジトリは Actions を commit SHA でピン留めすることが必須。
# バージョンを上げるときは、タグではなく SHA を差し替える（末尾のコメントも合わせる）。

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages へデプロイするために必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは止めず、後から来たものを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: ゲームロジックのテスト
        run: npm test
      - name: 公開用ファイルを _site に集める
        run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # actions/upload-pages-artifact は内部で actions/upload-artifact を「タグ」で呼ぶ
      # 複合アクションなので、SHAピン留め必須のこのリポジトリでは使えない。
      # やっていること（_site を artifact.tar に固めて github-pages という名前で上げる）を
      # そのまま展開している。artifact 名は deploy-pages の既定値なので変えないこと。
      - name: _site を artifact.tar に固める
        run: |
          tar \
            --dereference --hard-dereference \
            --directory _site \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
