name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 依存パッケージは 0 個なので install は不要
      - name: ゲームロジックのテスト
        run: npm test
      - name: 公開用ファイルの生成を確認
        run: npm run build
