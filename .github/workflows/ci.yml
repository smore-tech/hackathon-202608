name: CI

# このリポジトリは Actions を commit SHA でピン留めすることが必須。
# バージョンを上げるときは、タグではなく SHA を差し替える（末尾のコメントも合わせる）。

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # 依存パッケージは 0 個なので install は不要
      - name: ゲームロジックのテスト
        run: npm test
      - name: 公開用ファイルの生成を確認
        run: npm run build
