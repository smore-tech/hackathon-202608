<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10秒先を当てる</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .roster{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .card{
    width:158px; background:var(--panel2); border:2px solid var(--border); border-radius:14px;
    padding:12px 10px; cursor:pointer; position:relative; text-align:center;
    transition:transform .12s, border-color .15s, opacity .3s;
  }
  .card:hover{transform:translateY(-3px)}
  .card.picked{border-color:var(--amber); box-shadow:0 0 0 3px rgba(251,191,36,.16)}
  .card.picked::before{
    content:"YOUR PICK"; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    background:var(--amber); color:#3a2500; font-size:9px; font-weight:800; letter-spacing:.08em;
    padding:2px 8px; border-radius:999px; white-space:nowrap; font-family:var(--mono);
  }
  .card.dead{opacity:.3; filter:grayscale(1)}
  .card.attacking{animation:lunge .3s}
  .card.hurt{animation:hurt .3s}
  @keyframes lunge{50%{transform:translateY(-10px) scale(1.05)}}
  @keyframes hurt{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .face{font-size:32px; line-height:1.1}
  .nm{font-size:13px; font-weight:700; margin:4px 0 6px}
  .hpbar{height:9px; border-radius:999px; background:#333c52; overflow:hidden}
  .hpfill{height:100%; background:var(--accent); transition:width .25s}
  .hpfill.low{background:var(--red)}
  .hpnum{font-size:11px; color:var(--dim); margin-top:3px; font-family:var(--mono)}
  .stats{display:flex; justify-content:center; gap:8px; font-size:11px; margin-top:6px; color:var(--dim); font-family:var(--mono)}
  .stats b{color:var(--text)}
  .trait{font-size:10px; color:var(--violet); margin-top:6px; min-height:15px; line-height:1.35}
  .tgt{font-size:10px; color:var(--blue); margin-top:4px; min-height:14px; font-family:var(--mono)}
  .pop{
    position:absolute; left:50%; top:14px; transform:translateX(-50%);
    color:var(--red); font-weight:800; font-size:20px; pointer-events:none; font-family:var(--mono);
    animation:float .7s ease-out forwards;
  }
  .pop.heal{color:var(--accent)}
  .pop.thorns{color:var(--violet)}
  @keyframes float{to{transform:translate(-50%,-26px); opacity:0}}
  .crown{position:absolute; top:-14px; right:-6px; font-size:22px}

  .log{
    width:100%; max-width:560px; height:120px; overflow-y:auto; background:#0f131c;
    border:1px solid var(--border); border-radius:10px; padding:8px 12px;
    font-size:12px; line-height:1.7; color:var(--dim); font-variant-numeric:tabular-nums; font-family:var(--mono);
  }
  .log .ko{color:var(--red); font-weight:700}
  .log .heal{color:var(--accent)}
  .levelhead{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--dim); margin:14px 0 8px}
  .levelhead:first-child{margin-top:0}
  .rulebox{font-size:12px; color:var(--dim); text-align:center; max-width:620px; line-height:1.7; font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>10秒先を<span class="g">当てる</span></h1>
    <a class="home" href="../index.html">← ゲーム一覧</a>
    <div class="tabs">
      <button id="tabList">BATTLES</button>
      <button id="tabPlay" class="on">PLAY</button>
    </div>
  </div>
  <p class="tagline">// 介入はできない。数字と並び順だけを見て、最後の1体を当てろ</p>

  <div id="notice" hidden></div>

  <!-- ============ BATTLES ============ -->
  <div id="listView" hidden>
    <div class="panel">
      <div class="row spread" style="margin-bottom:12px">
        <div class="hud">
          <span>的中 <b id="hudHit2">0</b> / <span id="hudTotal2">0</span></span><span class="sep"></span>
          <span>制覇 <b id="hudCleared">0</b> / <span id="hudBattles">0</span></span>
        </div>
        <button id="resetProgress" class="ghost danger">記録をリセット</button>
      </div>
      <div id="battleList"></div>
    </div>
  </div>

  <!-- ============ PLAY ============ -->
  <div id="playView" class="center">
    <div class="hud">
      <span>編成 <b id="hudName">—</b></span><span class="sep"></span>
      <span>予想 <b id="hudPick">—</b></span><span class="sep"></span>
      <span>的中 <b id="hudScore">0 / 0</b></span><span class="sep"></span>
      <span>連続 <b id="hudStreak">0</b>（最高 <b id="hudBest">0</b>）</span>
    </div>

    <div class="rulebox">
      <b id="ruleName" style="color:var(--amber)">—</b> — <span id="ruleDesc">—</span><br>
      <span id="battleHint" style="color:var(--violet)"></span>
    </div>

    <div class="roster" id="roster"></div>

    <div class="banner" id="banner">生き残ると思うキャラをタップして、STARTを押す。</div>

    <div class="row" style="justify-content:center">
      <button id="start" class="primary" style="min-width:170px">▶ START</button>
      <button id="replay">↺ もう一度見る</button>
      <button id="nextBattle">次の編成 →</button>
      <button id="randomBattle">🎲 ランダム</button>
      <button id="shareBattle">🔗 SHARE</button>
    </div>

    <div class="row" style="justify-content:center">
      <span class="hint">SPEED</span>
      <button class="chip speed on" data-speed="1">×1</button>
      <button class="chip speed" data-speed="2">×2</button>
      <button class="chip speed" data-speed="8">一気に</button>
    </div>

    <div class="share-box" style="max-width:560px; width:100%">
      <div class="copy-status" id="copyStatus"></div>
      <textarea id="shareOut" rows="2" readonly hidden></textarea>
    </div>

    <div class="log" id="log"></div>
    <p class="hint" style="max-width:620px; text-align:center; line-height:1.8">
      行動間隔 = 1000 ÷ SPD（速いほど手数が多い）／ ダメージ = ATK − 相手のARMOR（最低1）／
      乱数は一切なし。同じ編成なら結果は必ず同じ。
    </p>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
