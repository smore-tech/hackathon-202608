<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>見えない迷路</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  body{touch-action:manipulation}
  :root{ --wall:#cdd7ec; --cell:min(14vw, 56px) }
  .stage{position:relative}
  .maze{
    display:grid; background:#141926; border:3px solid var(--wall); border-radius:6px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .cell{
    width:var(--cell); height:var(--cell); position:relative;
    display:flex; align-items:center; justify-content:center; font-size:calc(var(--cell)*.48);
    border-right:3px solid transparent; border-bottom:3px solid transparent;
    transition:border-color .3s;
  }
  .cell.wr{border-right-color:var(--wall)}
  .cell.wb{border-bottom-color:var(--wall)}
  .cell.hr{border-right-color:rgba(248,113,113,.85)}
  .cell.hb{border-bottom-color:rgba(248,113,113,.85)}
  .cell.bump{background:rgba(248,113,113,.28)}
  .cell.visited::before{content:""; position:absolute; inset:26%; border-radius:50%; background:rgba(125,211,252,.16)}
  #player{
    /* left/top を指定しないと基準が「迷路の直後」になり、transform で枠外へ飛ぶ */
    position:absolute; left:0; top:0; width:var(--cell); height:var(--cell);
    display:flex; align-items:center; justify-content:center; font-size:calc(var(--cell)*.52);
    transition:transform .1s ease-out; pointer-events:none; z-index:3;
    filter:drop-shadow(0 0 8px rgba(125,211,252,.8));
  }
  .countdown{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:58px; font-weight:800; color:rgba(255,255,255,.85); pointer-events:none;
    text-shadow:0 4px 20px rgba(0,0,0,.8); z-index:4; font-family:var(--mono);
  }
  .pad{display:grid; grid-template-columns:repeat(3,62px); grid-template-rows:repeat(2,52px); gap:8px}
  #up{grid-column:2/3}
  #left{grid-column:1/2; grid-row:2}
  #down{grid-column:2/3; grid-row:2}
  #right{grid-column:3/4; grid-row:2}
  .pad button{font-size:20px; padding:8px 12px}
  .actions button{min-width:130px}
  .levelhead{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--dim); margin:14px 0 8px}
  .levelhead:first-child{margin-top:0}
  .lives{letter-spacing:.12em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>見えない<span class="g">迷路</span></h1>
    <a class="home" href="../index.html">← ゲーム一覧</a>
    <div class="tabs">
      <button id="tabStages">STAGES</button>
      <button id="tabPlay" class="on">PLAY</button>
    </div>
  </div>
  <p class="tagline">// 壁が見えるのは最初の数秒だけ。あとは記憶だけが頼り</p>

  <div id="notice" hidden></div>

  <!-- ============ STAGES ============ -->
  <div id="stagesView" hidden>
    <div class="panel">
      <div class="row spread" style="margin-bottom:12px">
        <div class="hud">
          <span>CLEAR <b id="hudCleared">0</b> / <span id="hudTotal">0</span></span><span class="sep"></span>
          <span>★ <b id="hudStars">0</b> / <span id="hudStarMax">0</span></span>
        </div>
        <button id="resetProgress" class="ghost danger">記録をリセット</button>
      </div>
      <div id="stageList"></div>
    </div>
  </div>

  <!-- ============ PLAY ============ -->
  <div id="playView" class="center">
    <div class="row" style="justify-content:center">
      <span class="badge violet" id="chNo">STAGE 1</span>
      <b id="chName" style="font-size:14px">—</b>
      <span class="badge" id="chMode">ふつう</span>
      <button id="prevStage" class="ghost">◀</button>
      <button id="nextStage" class="ghost">▶</button>
    </div>

    <div class="hud">
      <span>SEED <b id="seed">—</b></span><span class="sep"></span>
      <span>移動 <b id="steps">0</b></span><span class="sep"></span>
      <span>壁ドン <b id="miss">0</b></span>
      <span id="livesWrap" hidden><span class="sep"></span>ライフ <b class="lives" id="lives">♥♥♥</b></span><span class="sep"></span>
      <span>時間 <b id="time">0.0</b>s</span><span class="sep"></span>
      <span>最短 <b id="need">—</b></span>
    </div>

    <div class="stage">
      <div class="maze" id="maze"></div>
      <div id="player">🔵</div>
      <div class="countdown" id="countdown"></div>
    </div>

    <div class="banner" id="banner">STARTを押すと迷路が見える。覚えて、🏁 まで進め。</div>

    <div class="pad">
      <button id="up">↑</button><button id="left">←</button>
      <button id="down">↓</button><button id="right">→</button>
    </div>

    <div class="row actions" style="justify-content:center">
      <button id="start" class="primary">▶ START</button>
      <button id="retry">↺ 同じ迷路で</button>
      <button id="newMaze">🎲 新しい迷路</button>
      <button id="share">🔗 SHARE</button>
    </div>

    <div class="share-box" style="max-width:520px; width:100%">
      <div class="copy-status" id="copyStatus"></div>
      <textarea id="shareOut" rows="2" readonly hidden></textarea>
    </div>

    <p class="hint" style="max-width:560px; text-align:center; line-height:1.8">
      矢印キー / WASD / 方向ボタン / スワイプで移動・Space=START。
      壁にぶつかると「壁ドン」が加算され、その壁は以後ずっと見えるようになる。
      SHARE で同じ迷路（seed）のURLを渡せる。
    </p>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
